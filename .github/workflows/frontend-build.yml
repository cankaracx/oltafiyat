name: Frontend Build Check

on:
  pull_request:
    paths:
      - "src/**"
      - "web/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "package.json"
      - "package-lock.json"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [".", "web"]
    name: build (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.dir }}
        run: npm run lint

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: npm run build
